<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>اختيار نوع الحساب</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>

  <div class="role-selection" id="roleSelection">

    <div class="title-page">
      <p>يمكنك التسجيل
        <br>
        <span id="seller">متجر الكتروني</span>
        <span id="seller">او</span>
        <span id="shipping">مكتب شحن</span>
      </p>
    </div>
    <div class="cards">
      <div id="merchantCard" class="role-card" onclick="handleRoleSelection('تاجر')">
        <img src="./imges/Online ads-amico.png" alt="تاجر">
        <span class="loading-span" id="loadingSpanMerchant">جاري التحميل...</span>
      </div>
      <div id="shippingCard" class="role-card" onclick="handleRoleSelection('مكتب شحن')">
        <img src="./imges/Take Away-pana.png" alt="مكتب شحن">
        <span class="loading-span" id="loadingSpanShipping">جاري التحميل...</span>
      </div>
    </div>
  </div>

  <div class="signup-container" id="signupForm">
    <h2 id="formTitle">تسجيل</h2>
    <p>لديك حساب بالفعل؟ <a href="./login.html" style="color: #FFD700;">تسجيل الدخول</a></p>
    <form id="signupForm">
      <div class="form-group">
        <label for="name">الاسم</label>
        <input type="text" id="name" placeholder="أدخل اسمك" required>
      </div>
      <div class="form-group">
        <label for="email">البريد الإلكتروني</label>
        <input type="email" id="email" placeholder="أدخل بريدك الإلكتروني" required>
      </div>
      <div class="form-group">
        <label for="password">كلمة المرور</label>
        <input type="password" id="password" placeholder="أدخل كلمة المرور (8 حروف على الأقل)" required>
      </div>
      <div class="form-group">
        <label for="confirmPassword">تأكيد كلمة المرور</label>
        <input type="password" id="confirmPassword" placeholder="أعد إدخال كلمة المرور" required>
      </div>
      <div class="form-group">
        <label for="phone">رقم الهاتف</label>
        <input type="tel" id="phone" placeholder="أدخل رقم الهاتف (مثال: 01234567890)" required>
      </div>
      <div class="form-group">
        <label for="governorate">المحافظة</label>
        <select id="governorate" required>
          <option value="">اختر المحافظة</option>
          <option value="القاهرة">القاهرة</option>
          <option value="الجيزة">الجيزة</option>
          <option value="الإسكندرية">الإسكندرية</option>
          <option value="الدقهلية">الدقهلية</option>
          <!-- أضف المحافظات الأخرى حسب الحاجة -->
        </select>
      </div>
      <div class="form-group">
        <label for="city">المدينة/القرية</label>
        <select id="city" required>
          <option value="">اختر المدينة أو القرية</option>
          <!-- الخيارات هتتغير ديناميكيًا بناءً على المحافظة -->
        </select>
      </div>
      <div class="form-group">
        <label for="address">العنوان</label>
        <textarea id="address" placeholder="أدخل عنوانك بالتفصيل" required></textarea>
      </div>
      <div class="form-group" id="productTypeGroup" style="display: none;">
        <label for="productType">نوع المنتجات</label>
        <select id="productType">
          <option value="">اختر نوع المنتجات</option>
          <option value="ملابس">ملابس</option>
          <option value="إلكترونيات">إلكترونيات</option>
          <option value="أغذية">أغذية</option>
          <option value="أثاث">أثاث</option>
        </select>
      </div>
      <button type="submit" class="signup-btn">تسجيل</button>
    </form>
    <p class="error-message" id="errorMessage">يرجى ملء جميع الحقول بشكل صحيح</p>
    <p class="success-message" id="successMessage">تم التسجيل بنجاح!</p>


    <span class="back-btn" onclick="goBack()">رجوع</span>
  </div>
  <div id="spinner" class="spinner"></div>
  <script type="text/javascript" src="./design.js"></script>
</body>

</html>
